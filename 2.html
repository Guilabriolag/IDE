<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDE WYSIWYG Avançado</title>
<style>
body{margin:0;font-family:Arial;background:#0d1117;color:#e6edf3;display:flex;flex-direction:column;height:100vh;}
header{background:#161b22;padding:10px;text-align:center;font-weight:bold;}
.tabs{display:flex;background:#161b22;}
.tabs button{flex:1;padding:10px;background:#21262d;border:none;color:#e6edf3;cursor:pointer;font-weight:bold;}
.tabs button.active{background:#238636;}
textarea{flex:1;width:100%;padding:10px;border:none;outline:none;resize:none;font-size:14px;background:#0d1117;color:#e6edf3;display:none;}
.buttons{display:flex;flex-wrap:wrap;gap:5px;padding:5px;background:#161b22;justify-content:center;}
button.action{background:#238636;color:white;border:none;padding:8px 12px;font-size:14px;border-radius:6px;cursor:pointer;}
button.action:hover{background:#2ea043;}
iframe{flex:1;border:none;background:white;}
.fullscreen{position:fixed!important;top:0;left:0;width:100vw!important;height:100vh!important;z-index:9998;}
#exitFullBtn{display:none;position:fixed;top:10px;right:10px;z-index:10000;background:#d73a49;color:white;border:none;padding:10px 14px;border-radius:6px;font-size:14px;cursor:pointer;}
#exitFullBtn:hover{background:#f85149;}
#previewToolbar{display:none;position:fixed;top:0;left:0;right:0;background:#161b22;padding:5px;z-index:9999;display:flex;gap:5px;flex-wrap:wrap;overflow-x:auto;}
#previewToolbar button,#previewToolbar select,#previewToolbar input{background:#238636;color:white;border:none;padding:5px 8px;border-radius:4px;cursor:pointer;}
#previewToolbar button:hover,#previewToolbar select:hover,#previewToolbar input:hover{background:#2ea043;}
</style>
</head>
<body>
<header>📱 IDE Mobile WYSIWYG Avançado</header>

<div class="tabs">
  <button id="tabHTML" class="active" onclick="showTab('html')">HTML</button>
  <button id="tabCSS" onclick="showTab('css')">CSS</button>
  <button id="tabJS" onclick="showTab('js')">JS</button>
</div>

<textarea id="editorHTML"></textarea>
<textarea id="editorCSS"></textarea>
<textarea id="editorJS"></textarea>

<div class="buttons">
  <button class="action" onclick="runCode()">▶ Executar</button>
  <button class="action" onclick="saveCode()">💾 Salvar</button>
  <button class="action" onclick="loadCode()">📂 Carregar</button>
  <button class="action" onclick="copyBack()">⤴ Copiar de volta</button>
  <button class="action" onclick="saveFromPreview()">💡 Salvar alterações do Preview</button>
  <button class="action" onclick="undo()">↩ Undo</button>
  <button class="action" onclick="toggleFull()">🖥 Tela cheia</button>
</div>

<!-- Toolbar Preview Ultra -->
<div id="previewToolbar">
  <button onclick="execCommand('bold')">B</button>
  <button onclick="execCommand('italic')">I</button>
  <button onclick="execCommand('underline')">U</button>
  <select onchange="execCommand('fontName', this.value)">
    <option value="">Fonte</option>
    <option value="Arial">Arial</option>
    <option value="Courier New">Courier</option>
    <option value="Times New Roman">Times</option>
    <option value="Verdana">Verdana</option>
  </select>
  <select onchange="execCommand('fontSize', this.value)">
    <option value="">Tamanho</option>
    <option value="1">10px</option>
    <option value="2">13px</option>
    <option value="3">16px</option>
    <option value="4">18px</option>
    <option value="5">24px</option>
    <option value="6">32px</option>
    <option value="7">48px</option>
  </select>
  <input type="color" onchange="execCommand('foreColor', this.value)" title="Cor do texto">
  <input type="color" onchange="execCommand('backColor', this.value)" title="Cor de fundo">
  <button onclick="execCommand('justifyLeft')">⮜</button>
  <button onclick="execCommand('justifyCenter')">≡</button>
  <button onclick="execCommand('justifyRight')">⮞</button>
  <button onclick="execCommand('insertOrderedList')">OL</button>
  <button onclick="execCommand('insertUnorderedList')">UL</button>
  <button onclick="addLink()">🔗 Link</button>
  <button onclick="addImage()">🖼 Imagem</button>
  <button onclick="addVideo()">🎬 Vídeo</button>
</div>

<iframe id="preview"></iframe>
<button id="exitFullBtn" onclick="toggleFull()">❌ Sair Tela Cheia</button>

<script>
const editorHTML=document.getElementById("editorHTML");
const editorCSS=document.getElementById("editorCSS");
const editorJS=document.getElementById("editorJS");
const preview=document.getElementById("preview");
const exitBtn=document.getElementById("exitFullBtn");
const previewToolbar=document.getElementById("previewToolbar");

let history=[]; let full=false;

// Tabs
function showTab(tab){
  document.querySelectorAll("textarea").forEach(t=>t.style.display="none");
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  if(tab==="html"){editorHTML.style.display="block";document.getElementById("tabHTML").classList.add("active");}
  else if(tab==="css"){editorCSS.style.display="block";document.getElementById("tabCSS").classList.add("active");}
  else{editorJS.style.display="block";document.getElementById("tabJS").classList.add("active");}
}

// Run
function runCode(){
  const code=`<!DOCTYPE html><html><head><style>${editorCSS.value}</style></head><body contenteditable="true" ondrop="handleDrop(event)" ondragover="event.preventDefault()">${editorHTML.value}<script>${editorJS.value}document.body.contentEditable=true;document.designMode="on";function handleDrop(e){e.preventDefault();if(e.dataTransfer.files.length>0){const file=e.dataTransfer.files[0];if(file.type.startsWith('image/')){const reader=new FileReader();reader.onload=function(ev){const img=document.createElement('img');img.src=ev.target.result;img.style.maxWidth="100%";document.body.appendChild(img);};reader.readAsDataURL(file);}}}<\/script></body></html>`;
  preview.srcdoc=code;
  history.push({html:editorHTML.value,css:editorCSS.value,js:editorJS.value});
}

// Save/Load
function saveCode(){localStorage.setItem("ideEditorCode",JSON.stringify({html:editorHTML.value,css:editorCSS.value,js:editorJS.value}));alert("✅ Código salvo!");}
function loadCode(){const saved=localStorage.getItem("ideEditorCode");if(saved){const data=JSON.parse(saved);editorHTML.value=data.html;editorCSS.value=data.css;editorJS.value=data.js;runCode();alert("📂 Código carregado!");}else alert("⚠ Nenhum código salvo encontrado.");}
function copyBack(){const iframeDoc=preview.contentDocument||preview.contentWindow.document;editorHTML.value=iframeDoc.body.innerHTML;alert("⤴ Copiado do Preview para HTML!");}
function saveFromPreview(){const iframeDoc=preview.contentDocument||preview.contentWindow.document;editorHTML.value=iframeDoc.body.innerHTML;runCode();alert("💡 Alterações do Preview salvas no editor!");}
function undo(){if(history.length>1){history.pop();const last=history[history.length-1];editorHTML.value=last.html;editorCSS.value=last.css;editorJS.value=last.js;runCode();}else alert("⚠ Sem histórico para desfazer.");}
function toggleFull(){if(!full){preview.classList.add("fullscreen");exitBtn.style.display="block";previewToolbar.style.display="flex";full=true;}else{preview.classList.remove("fullscreen");exitBtn.style.display="none";previewToolbar.style.display="none";full=false;}}

// Editor commands
function execCommand(cmd,value=null){const iframeDoc=preview.contentDocument||preview.contentWindow.document;if(value)iframeDoc.execCommand(cmd,false,value);else iframeDoc.execCommand(cmd,false,null);}
function addLink(){const url=prompt("Digite a URL:","https://");if(url){const iframeDoc=preview.contentDocument||preview.contentWindow.document;iframeDoc.execCommand('createLink',false,url);}}
function addImage(){const url=prompt("URL da imagem:","https://");if(url){const iframeDoc=preview.contentDocument||preview.contentWindow.document;iframeDoc.execCommand('insertImage',false,url);}}
function addVideo(){const url=prompt("URL do vídeo (YouTube ou MP4):","https://");if(url){const iframeDoc=preview.contentDocument||preview.contentWindow.document;const vid=document.createElement('iframe');vid.src=url;vid.width="560";vid.height="315";vid.frameBorder="0";vid.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";vid.allowFullscreen=true;iframeDoc.body.appendChild(vid);}}

// Ctrl+Z
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="z"){undo();}});

// Inicial
editorHTML.value=`<h1>Olá mundo!</h1><p>Arraste imagens ou insira vídeos no Preview!</p>`;
editorCSS.value=`body{font-family:Arial;background:#f0f0f0;}h1{color:red;}`;
editorJS.value=`console.log("JS rodando!");`;
showTab("html"); runCode();
</script>
</body>
</html>
