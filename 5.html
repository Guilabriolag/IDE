<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDE Mobile Pro</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0d1117; color: white; height: 100vh; overflow: hidden; }
        
        /* Containers de Modo */
        #codeContainer, #visualContainer { height: 100vh; width: 100vw; display: flex; flex-direction: column; }
        #visualContainer { display: none; background: white; }
        textarea { flex: 1; padding: 20px; background: #0d1117; color: #7ee787; border: none; }
        
        /* Estojo Flutuante */
        #estojo {
            position: fixed; top: 100px; right: 20px; width: 50px; height: 50px;
            background: #238636; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: move; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 1000;
        }
        #estojo-menu { display: none; position: absolute; bottom: 60px; right: 0; background: #161b22; padding: 10px; border-radius: 10px; width: 150px; }
    </style>
</head>
<body>

    <!-- Modo Código -->
    <div id="codeContainer">
        <textarea id="editor"><h1>Olá</h1><p>Edite-me!</p></textarea>
        <button onclick="alternarModo()">Mudar para Visual</button>
    </div>

    <!-- Modo Visual -->
    <div id="visualContainer">
        <iframe id="preview" style="flex:1; border:none;"></iframe>
        <button onclick="alternarModo()">Mudar para Código</button>
    </div>

    <!-- Estojo -->
    <div id="estojo" onclick="toggleMenu()">🧰
        <div id="estojo-menu">
            <button onclick="execCmd('bold')">Negrito</button><br>
            <button onclick="execCmd('foreColor', 'red')">Cor Vermelha</button>
        </div>
    </div>

    <script>
        let modoVisual = false;
        
        // Alternar entre Código e Visual
        function alternarModo() {
            modoVisual = !modoVisual;
            const codeCont = document.getElementById('codeContainer');
            const visCont = document.getElementById('visualContainer');
            const editor = document.getElementById('editor');
            const preview = document.getElementById('preview');

            if (modoVisual) {
                codeCont.style.display = "none";
                visCont.style.display = "flex";
                preview.srcdoc = editor.value + "<body contenteditable='true'></body>";
            } else {
                visCont.style.display = "none";
                codeCont.style.display = "flex";
                editor.value = preview.contentDocument.body.innerHTML;
            }
        }

        // Estojo: Lógica de arrastar
        const estojo = document.getElementById('estojo');
        estojo.addEventListener('touchmove', (e) => {
            estojo.style.left = e.touches[0].clientX + 'px';
            estojo.style.top = e.touches[0].clientY + 'px';
        });

        function toggleMenu() {
            const menu = document.getElementById('estojo-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function execCmd(cmd, val) {
            document.getElementById('preview').contentDocument.execCommand(cmd, false, val);
        }
    </script>
</body>
</html>
