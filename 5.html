<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mobile IDE</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; }
        .header { padding: 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid #30363d; }
        .content { padding: 20px; }
        .card { background: #161b22; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #30363d; cursor: pointer; }
        .btn-add { background: #238636; color: white; padding: 10px; border-radius: 6px; text-align: center; margin-top: 20px; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- TELA 1: HOME (Dashboard) -->
    <div id="screen-home">
        <div class="header">Home</div>
        <div class="content">
            <h3>Meu Trabalho</h3>
            <div id="lista-projetos"></div>
            <div class="btn-add" onclick="criarProjeto()">+ Novo Repositório</div>
        </div>
    </div>

    <!-- TELA 2: PROJETO (Lista de arquivos) -->
    <div id="screen-projeto" class="hidden">
        <div class="header" onclick="voltar()">⬅ Voltar</div>
        <div class="content">
            <h2 id="titulo-projeto"></h2>
            <div id="lista-arquivos"></div>
            <div class="btn-add" onclick="adicionarArquivo()">+ Adicionar Arquivo</div>
        </div>
    </div>

    <script>
        // Dados do App
        let projetos = JSON.parse(localStorage.getItem('meusProjetos')) || [];

        // Navegação simples
        function voltar() {
            document.getElementById('screen-projeto').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
        }

        // Criar Projeto
        function criarProjeto() {
            let nome = prompt("Nome do novo Repositório:");
            if (nome) {
                projetos.push({ nome: nome, arquivos: [] });
                salvar();
                renderHome();
            }
        }

        // Salvar dados
        function salvar() {
            localStorage.setItem('meusProjetos', JSON.stringify(projetos));
        }

        // Renderizar a Home
        function renderHome() {
            let container = document.getElementById('lista-projetos');
            container.innerHTML = '';
            projetos.forEach((p, index) => {
                container.innerHTML += `<div class="card" onclick="abrirProjeto(${index})">📁 ${p.nome}</div>`;
            });
        }

        // Abrir Projeto
        function abrirProjeto(index) {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-projeto').classList.remove('hidden');
            document.getElementById('titulo-projeto').innerText = projetos[index].nome;
        }

        // Inicializa
        renderHome();
    </script>
</body>
</html>
