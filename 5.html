<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Code IDE Mobile</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }
        
        /* Área Principal que muda de conteúdo */
        #main-content { flex: 1; overflow-y: auto; padding: 20px; }
        .screen { display: none; }
        .active { display: block; }

        /* Barra de Navegação Inferior (GitHub Style) */
        #bottom-nav { height: 60px; background: #161b22; border-top: 1px solid #30363d; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { cursor: pointer; color: #8b949e; font-size: 12px; text-align: center; }
        .nav-item.active { color: #58a6ff; }
    </style>
</head>
<body>

    <!-- Conteúdo Dinâmico -->
    <div id="main-content">
        <!-- Tela Home -->
        <div id="screen-home" class="screen active">
            <h1>Home</h1>
            <p>Seus repositórios e projetos.</p>
        </div>

        <!-- Tela Editor -->
        <div id="screen-editor" class="screen">
            <h1>Editor</h1>
            <p>Área de código e o "estojo" flutuante.</p>
        </div>

        <!-- Tela Perfil/Config -->
        <div id="screen-config" class="screen">
            <h1>Configurações</h1>
            <p>Login, senha e preferências.</p>
        </div>
    </div>

    <!-- Barra de Navegação Inferior -->
    <nav id="bottom-nav">
        <div class="nav-item active" onclick="navegar('home', this)">🏠 Home</div>
        <div class="nav-item" onclick="navegar('editor', this)">💻 Editor</div>
        <div class="nav-item" onclick="navegar('config', this)">⚙️ Config</div>
    </nav>

    <script>
        function navegar(nomeTela, elemento) {
            // 1. Esconde todas as telas
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            // 2. Remove o destaque de todos os itens da barra
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            // 3. Mostra a tela clicada
            document.getElementById('screen-' + nomeTela).classList.add('active');
            // 4. Dá destaque ao botão clicado
            elemento.classList.add('active');
        }
    </script>
</body>
</html>
